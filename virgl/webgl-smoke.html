<html lang="zh-CN"><meta charset="utf-8"><title>VirGL WebGL smoke</title>
<style>body{margin:24px;background:#17202a;color:#ecf0f1;font:18px monospace}canvas{width:384px;height:384px;image-rendering:pixelated;float:left;margin-right:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:24px}</style>
<h1>Chromium · WebGL shader/readPixels</h1><canvas id="view" width="64" height="64"></canvas><pre id="status">开始测试…</pre>
<script>
'use strict';
(async () => {
  const report = {schema:'xkernel-webgl-smoke-v1', run:new URLSearchParams(location.search).get('run'),
    user_agent:navigator.userAgent, context_created:false, phases:[], errors:[]};
  const output=document.getElementById('status'), canvas=document.getElementById('view');
  let gl;
  try {
    gl=canvas.getContext('webgl', {alpha:false, antialias:false, depth:false, stencil:false,
      preserveDrawingBuffer:true, failIfMajorPerformanceCaveat:true, powerPreference:'high-performance'});
    if (!gl) throw new Error('WebGL 1 context creation failed');
    report.context_created=true;
    report.attributes=gl.getContextAttributes();
    report.vendor=gl.getParameter(gl.VENDOR);
    report.renderer=gl.getParameter(gl.RENDERER);
    report.version=gl.getParameter(gl.VERSION);
    report.shading_language=gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
    const debug=gl.getExtension('WEBGL_debug_renderer_info');
    report.debug_renderer_available=!!debug;
    report.unmasked_vendor=debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null;
    report.unmasked_renderer=debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null;
    const compile=(type,source) => {
      const shader=gl.createShader(type); gl.shaderSource(shader,source); gl.compileShader(shader);
      const info=gl.getShaderInfoLog(shader);
      if (!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error('Shader compile: '+info);
      return shader;
    };
    const vertex=compile(gl.VERTEX_SHADER,'attribute vec2 p; void main(){gl_Position=vec4(p,0.0,1.0);}');
    const fragment=compile(gl.FRAGMENT_SHADER,'precision mediump float; uniform float b; void main(){gl_FragColor=vec4(gl_FragCoord.xy/64.0,b,1.0);}');
    const program=gl.createProgram(); gl.attachShader(program,vertex);gl.attachShader(program,fragment);gl.linkProgram(program);
    report.program_linked=gl.getProgramParameter(program,gl.LINK_STATUS);
    report.link_log=gl.getProgramInfoLog(program);
    if (!report.program_linked) throw new Error('Program link: '+report.link_log);
    gl.useProgram(program);
    const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const location=gl.getAttribLocation(program,'p');
    gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,2,gl.FLOAT,false,0,0);
    gl.viewport(0,0,64,64);gl.disable(gl.DITHER);
    const points=[[8,8],[56,8],[8,56],[56,56],[24,24],[40,24],[24,40],[40,40]];
    for (const blue of [.25,.75]) {
      gl.clearColor(1,0,1,1);gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(gl.getUniformLocation(program,'b'),blue);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
      const samples=[];
      for (const [x,y] of points) {
        const pixel=new Uint8Array(4);gl.readPixels(x,y,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);
        samples.push({x,y,rgba:Array.from(pixel)});
      }
      report.phases.push({blue,samples,gl_error:gl.getError()});
    }
    report.context_lost=gl.isContextLost();
    gl.deleteBuffer(buffer);gl.deleteProgram(program);gl.deleteShader(vertex);gl.deleteShader(fragment);
    output.textContent='GPU: '+report.unmasked_renderer+'\n两次 shader / 16 点读回已完成\n等待采集端独立校验；画面取证需另行完成。';
    report.animation_frame_seen=await Promise.race([
      new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>resolve(true)))),
      new Promise(resolve=>setTimeout(()=>resolve(false),2000))]);
  } catch (error) {
    report.errors.push(String(error));
    report.context_lost=gl ? gl.isContextLost() : null;
    output.textContent='未通过：'+String(error);
  }
  try {
    const response=await fetch('/result', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});
    const verdict=await response.json();
    output.textContent=(verdict.readback_passed ? 'READBACK PASS' : 'FAIL / INCONCLUSIVE')+
      '\n'+(report.unmasked_renderer || report.renderer || '无 renderer 证据')+
      '\n'+JSON.stringify(verdict,null,2)+'\n\n此结果不替代 QEMU 可见画面与宿主 GPU 证据。';
    document.title=verdict.readback_passed ? 'VirGL WebGL READBACK PASS' : 'VirGL WebGL not verified';
  } catch (error) {output.textContent+='\n结果回传失败：'+String(error);}
})();
</script></html>
